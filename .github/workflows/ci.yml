name: CI / CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.5"
          enable-cache: true
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
      - run: make setup check
        env:
          CEDAR_DATABASE_URL: ""

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: cedar-production
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Deploy and verify production
        run: python3 scripts/request_deployment.py
        env:
          GH_TOKEN: ${{ github.token }}
