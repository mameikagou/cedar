<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cedar</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">CEDAR</p>
        <h1>从这里开始。</h1>
        <p class="lead">Cedar 已准备好，接下来一起把想法做出来。</p>
      </header>
      <section class="grid" aria-label="服务状态" aria-live="polite">
        <article>
          <p class="eyebrow">SERVICE</p>
          <h2>服务连接</h2>
          <p id="api-status" class="status">正在连接…</p>
        </article>
        <article>
          <p class="eyebrow">DATABASE</p>
          <h2>数据连接</h2>
          <p id="database-status" class="status">正在连接…</p>
        </article>
      </section>
      <button id="refresh" type="button">重新检查</button>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
